# Every pull request to main, and every push to main: install, build, run the tests, and check what would ship.
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels the run still going for the old one; runs on main always finish.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # Windows, like the machine the extension is developed on: some handoff tests use Windows paths.
    runs-on: windows-latest
    # Git Bash rather than PowerShell; naming bash explicitly also adds pipefail.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # npm runs scripts with cmd on Windows, so `node --test test/*.test.js` needs Node 22+ to expand the glob.
          node-version: 24
          cache: npm

      - run: npm ci

      # Compiles, bundles dist/extension.js, then runs test/*.test.js (including activation.test.js against the
      # bundle). realData.test.js skips itself here: the runner has no ~/.claude/projects.
      - run: npm test

      # The rules live in scripts/check-package.mjs, which every local `vsce package` also runs (vscode:prepublish).
      # Here it can only catch a .vscodeignore rule going missing: gitignored local-only folders (.claude/, .tmp/)
      # never exist on the runner. A real file in one of them is caught when packaging locally, where releases are built.
      - name: Check what the .vsix would contain
        run: node scripts/check-package.mjs --list

      # Full manifest validation (and the prepublish check again); the .vsix goes to the runner's temp folder and is not kept.
      - name: Package
        run: npx vsce package --out "$RUNNER_TEMP/check.vsix"
